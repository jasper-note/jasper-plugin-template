# Release: push a `v<version>` tag (matching manifest.toml `version`) to build,
# package and attach <id>-<version>.jplug (+ .sha256) to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify tag matches manifest version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          got=$(grep -m1 '^version = ' manifest.toml | cut -d'"' -f2)
          if [ "$got" != "$ver" ]; then
            echo "::error::manifest.toml version is $got but tag says $ver"
            exit 1
          fi
      - name: Unit tests (native)
        run: cargo test
      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Validate + package .jplug
        run: python3 scripts/package.py
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.jplug dist/*.sha256 --title "$GITHUB_REF_NAME" --generate-notes
